# Tyhp Language (tyhp-lang) — PhpStorm plugin
pluginGroup=com.tyhp.lang
pluginName=Tyhp Language
pluginVersion=0.7.0
pluginSinceBuild=262

# Current PhpStorm (2026.2.x, platform branch 262). Platform LSP API
# (com.intellij.platform.lsp) has shipped since 2023.2; 2026.2 includes the
# 2026.1.4 client rename (LspIntegrationProvider) used by this plugin.
platformType=PS
platformVersion=2026.2.1

# PHP plugin is bundled in PhpStorm; required for PHP Remote Debug / XDebug (Phase 13).
# TextMate Bundles is required for Phase 9 grammar highlighting.
platformBundledPlugins=com.jetbrains.php,org.jetbrains.plugins.textmate

# Compile against the Platform LSP API so Phase 11 can implement
# LspIntegrationProvider without changing the Gradle baseline.
platformBundledModules=intellij.platform.lsp

# Use the Kotlin stdlib bundled with PhpStorm; do not package a second copy.
kotlin.stdlib.default.dependency=false

org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
